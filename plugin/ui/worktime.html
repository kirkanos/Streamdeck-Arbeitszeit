<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Worktime settings</title>
    <script src="sdpi-components.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="panel-connection"></div>

    <div class="requires-connection" hidden>
      <sdpi-item label="Target hours">
        <sdpi-textfield setting="targetHours" type="number" min="1" max="14" step="0.25" placeholder="8"></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Maximum hours">
        <sdpi-textfield setting="maxHours" type="number" min="1" max="16" step="0.25" placeholder="10"></sdpi-textfield>
      </sdpi-item>

      <p class="hint">
        The bar fills up to the target hours, overtime is appended in orange up to the maximum. Breaks follow the panel:
        30 minutes from 6 hours, 45 minutes from 8 hours. Press to clock in, pause or resume; hold for a moment to end the
        day. If you set your own title, the caption under the time is left out.
      </p>
    </div>
  </body>
</html>
