# Build and test on every push and pull request; the packed plugin is kept as
# a workflow artifact for manual testing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds dist/, validates the manifest and writes Release/*.streamDeckPlugin
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: streamdeck-arbeitszeit-plugin
          path: Release/*.streamDeckPlugin
          if-no-files-found: error
