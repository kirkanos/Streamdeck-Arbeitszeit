# Publishes a GitHub release for tags like v1.0.0: builds and tests the plugin
# with the tag version in the manifest and attaches the .streamDeckPlugin file.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack plugin
        run: PLUGIN_VERSION="${GITHUB_REF_NAME#v}" npm run pack
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Release/*.streamDeckPlugin \
            --title "Worktime ${GITHUB_REF_NAME#v}" \
            --verify-tag \
            --generate-notes
